<!DOCTYPE html><html><head><base target="_top"><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--n:#1f3f8f;--b:#e8eefb;--r:#c62828}
*{box-sizing:border-box}body{margin:0;font-family:'Sarabun',sans-serif;background:#f4f6fb;color:#1b2440}
header{background:var(--n);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px}
header img{width:44px;height:44px;border-radius:50%;background:#fff}
header b{flex:1;line-height:1.25}header small{display:block;font-weight:400;opacity:.85}
main{max-width:720px;margin:auto;padding:12px}
.card{background:#fff;border:1px solid #d5ddf0;border-radius:12px;padding:12px;margin-bottom:12px}
.card h3{margin:0;color:var(--n)}.t{font-size:13px;color:#566}
.badge{float:right;background:var(--b);color:var(--n);border-radius:99px;padding:2px 10px;font-size:13px}
.full .badge{background:#fde8e8;color:var(--r)}
ol{margin:8px 0;padding:0;list-style:none}
li{padding:6px 8px;border-bottom:1px solid #eef1f8;display:flex;gap:8px}li.me{background:#fff6d6;font-weight:600}li span:last-child{margin-left:auto;color:#667}
input[type=text],input[type=password]{width:100%;padding:10px;border:1px solid #b9c5e4;border-radius:8px;font:inherit}
button{background:var(--n);color:#fff;border:0;border-radius:8px;padding:10px 14px;font:inherit;cursor:pointer}
button.s{background:#fff;color:var(--n);border:1px solid var(--n)}button:disabled{opacity:.6}
.row{display:flex;gap:8px;margin-top:8px}.row input{flex:1}
.ban{background:#e7f5e8;border:1px solid #a8d5ab;color:#1b5e20;padding:10px;border-radius:10px;margin-bottom:12px}
#cam{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:9}
#cam .box{background:#fff;border-radius:14px;padding:12px;width:min(92vw,380px);text-align:center}
.vw{position:relative;aspect-ratio:3/4;background:#111;border-radius:10px;overflow:hidden}
.vw video,.vw img{width:100%;height:100%;object-fit:cover}.vw video{transform:scaleX(-1)}
.vw svg{position:absolute;inset:0;width:100%;height:100%}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:8px}
.g img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px}
</style></head><body>

const gasRun=(f,a)=>new Promise((ok,no)=>google.script.run.withSuccessHandler(ok).withFailureHandler(no)[f](...a));
const formRun=(f,a)=>new Promise((ok,no)=>{const id='r'+Math.random().toString(36).slice(2),fr=document.createElement('iframe'),fm=document.createElement('form'),inp=document.createElement('input');

function logout(){clearInterval(timer);U=AP=TU=TP=null;drafts={};loginView();}
async function tLogin(){const u=$('tu').value.trim(),p=$('tp').value;$('er').textContent='กำลังตรวจสอบ…';let r;try{r=await run('teacherLogin',u,p);}catch(e){$('er').textContent='เชื่อมต่อระบบไม่ได้: '+(e.message||e);return}if(!r.ok){$('er').textContent='ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง';return}
 $('out').hidden=false;if(r.role=='admin'){AP=p;adm(await run('adminInfo',AP));}else{TU=u;TP=p;TN=r.name;tView();}}
async function tView(){M.innerHTML='<div class="ban">'+esc(TN)+' <button class="s" style="float:right;padding:4px 10px" onclick="tView()">รีเฟรช</button></div><div id="tl">กำลังโหลด…</div>';
 const d=await run('teacherData',TU,TP);
 $('tl').innerHTML=d.length?d.map(c=>'<div class="card"><h3>'+esc(c.name)+'</h3><div class="t">สมัครแล้ว '+c.list.length+'/'+c.cap+' · รับเข้าแล้ว '+c.list.filter(p=>p.ok).length+' คน</div><ol>'+c.list.map(p=>'<li><span>'+p.n+'.</span><span>'+esc(p.name)+' <small class="t">'+esc(p.room)+'</small></span><span><label><input type="checkbox" '+(p.ok?'checked':'')+' onchange="tOk(\''+p.id+'\',this)"> รับเข้าชุมนุม</label></span></li>').join('')+'</ol></div>').join(''):'<div class="card">บัญชีนี้ยังไม่ได้ผูกกับชุมนุมใด</div>';}
async function tOk(id,cb){const r=await run('setApproved',TU,TP,id,cb.checked);if(!r.ok){alert(r.msg);cb.checked=!cb.checked}}
async function aOk(id,cb){const r=await run('setApproved','admin',AP,id,cb.checked);if(!r.ok){alert(r.msg);cb.checked=!cb.checked}}
async function load(){S=await run('getState',U.id);draw();}
function draw(){
 const mine=S.my&&S.clubs.find(c=>c.id==S.my);
 let h='<div class="ban">'+esc(U.name)+' ห้อง '+esc(U.room)+' · เลขประจำตัว '+U.id+(mine?'<br>✅ สมัครแล้ว: '+esc(mine.name)+' (หากต้องการเปลี่ยน ให้ลบชื่อตัวเองก่อน)':'<br>เลือกสมัครได้ 1 ชุมนุม')+'</div>';
 S.clubs.forEach(c=>{const left=c.cap-c.list.length,full=left<=0;
  h+='<div class="card '+(full?'full':'')+'"><span class="badge">'+(full?'เต็มแล้ว':'เหลือ '+left+' ที่')+'</span><h3>'+esc(c.name)+'</h3><div class="t">'+esc(c.teacher)+' · สมัคร '+c.list.length+'/'+c.cap+'</div><ol>'
  +c.list.map(p=>'<li class="'+(p.me?'me':'')+'"><span>'+p.n+'.</span><span>'+esc(p.name)+(p.ok?' <b style="color:#2e7d32">✔ รับเข้าชุมนุม</b>':'')+'</span><span>'+esc(p.room)+(p.me?' <a href="#" onclick="del();return false" style="color:var(--r)">ลบชื่อฉัน</a>':'')+'</span></li>').join('')+'</ol>';
  if(!S.my){h+=full?'<div class="t">ชุมนุมนี้เต็มแล้ว</div>':'<div class="row"><input type="text" placeholder="ชื่อ-สกุล" value="'+esc(drafts[c.id])+'" oninput="drafts['+c.id+']=this.value"><button onclick="pick('+c.id+')">สมัคร</button></div>';}
  h+='</div>';});
 M.innerHTML=h;}
async function del(){if(!confirm('ลบชื่อของคุณออกจากชุมนุมนี้?'))return;await run('cancel',U.id);drafts={};await load();}
function pick(id){const n=(drafts[id]||'').trim();if(n.length<3){alert('กรุณากรอกชื่อ-สกุล');return}pend=id;openCam();}

const FRAME='<svg viewBox="0 0 300 400"><ellipse cx="150" cy="150" rx="75" ry="95" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="8 6"/><path d="M15 400C15 330 85 295 150 295S285 330 285 400" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="8 6"/></svg>';
async function openCam(){$('cam').style.display='flex';shot=null;const vw=$('vw');
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:960},height:{ideal:1280}}});
  vw.innerHTML='<video autoplay playsinline muted></video>'+FRAME;vw.firstChild.srcObject=stream;
  $('cb').innerHTML='<div class="row"><button class="s" onclick="closeCam()">ยกเลิก</button><button style="flex:1" onclick="snap()">ถ่ายภาพ</button></div>';
 }catch(e){if(API){vw.innerHTML='<div style="color:#fff;padding:40px 12px;font-size:14px">เปิดกล้องไม่ได้ กรุณากด "อนุญาต" การใช้กล้อง (และเปิดลิงก์ด้วย Chrome/Safari ไม่ใช่ในแอป LINE) แล้วกดลองใหม่</div>';$('cb').innerHTML='<div class="row"><button class="s" onclick="closeCam()">ยกเลิก</button><button style="flex:1" onclick="openCam()">ลองใหม่</button></div>';return;}vw.innerHTML='<div style="color:#fff;padding:40px 12px;font-size:14px">เปิดกล้องในหน้านี้ไม่ได้ กดปุ่ม "เปิดกล้อง" เพื่อถ่ายด้วยกล้องของเครื่อง<br>จัดใบหน้าและไหล่ให้อยู่กลางภาพ</div>';
  $('cb').innerHTML='<div class="row"><button class="s" onclick="closeCam()">ยกเลิก</button><input type="file" id="f" accept="image/*" capture="user" hidden onchange="fromFile(this.files[0])"><button style="flex:1" onclick="$(\'f\').click()">เปิดกล้อง</button></div>';}}
function crop(src,w,h){const c=document.createElement('canvas');c.width=480;c.height=640;const k=Math.max(480/w,640/h),dw=w*k,dh=h*k;c.getContext('2d').drawImage(src,(480-dw)/2,(640-dh)/2,dw,dh);return c.toDataURL('image/jpeg',.8);}
function snap(){const v=$('vw').firstChild;shot=crop(v,v.videoWidth,v.videoHeight);stopS();review();}
function fromFile(f){if(!f)return;const i=new Image();i.onload=()=>{shot=crop(i,i.naturalWidth,i.naturalHeight);review();};i.src=URL.createObjectURL(f);}
function review(){$('vw').innerHTML='<img src="'+shot+'">';$('cb').innerHTML='<div class="row"><button class="s" onclick="openCam()">ถ่ายใหม่</button><button style="flex:1" id="ok" onclick="send()">ยืนยันสมัคร</button></div>';}
function stopS(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
function closeCam(){stopS();$('cam').style.display='none';}
async function send(){const b=$('ok');b.disabled=true;b.textContent='กำลังส่ง…';
 try{const r=await run('register',U.id,pend,drafts[pend],shot);if(!r.ok)alert(r.msg);else drafts={};closeCam();await load();}
 catch(e){alert('ส่งไม่สำเร็จ ลองใหม่');b.disabled=false;b.textContent='ยืนยันสมัคร';}}

function adminView(){M.innerHTML='<div class="card"><h3>แอดมิน</h3><input type="password" id="ap" placeholder="รหัสแอดมิน"><div class="row"><button style="flex:1" onclick="adminGo()">เข้าสู่ระบบ</button></div></div>';}
async function adminGo(){AP=$('ap').value;try{adm(await run('adminInfo',AP));}catch(e){alert('รหัสไม่ถูกต้อง');}}
function adm(i){M.innerHTML='<div class="card"><h3>สมัครแล้ว '+i.reg+'/'+i.total+' คน</h3><div class="t">ที่นั่งรวม '+i.seats+' · คงเหลือ '+(i.total-i.reg)+' คนยังไม่สมัคร</div><div class="row"><button style="flex:1" onclick="exp()">ส่งออกข้อมูล (ตามชุมนุม + ตามห้อง)</button></div><div id="ex"></div></div>'
 +i.clubs.map(c=>'<div class="card"><b>'+esc(c.name)+'</b> สมัครแล้ว '+c.n+' คน<div class="t">จำนวนรับ (แก้ไขได้):</div><div class="row"><input type="text" inputmode="numeric" id="c'+c.id+'" value="'+c.cap+'" style="max-width:90px"><button onclick="setCap('+c.id+')">บันทึกจำนวนรับ</button><button class="s" onclick="ph('+c.id+',this)">ดูรูป</button></div><div class="g" id="p'+c.id+'"></div></div>').join('');}
async function setCap(id){const r=await run('adminSetCap',AP,id,$('c'+id).value);alert(r.ok?'บันทึกแล้ว: รับ '+r.cap+' คน':r.msg);if(r.ok)adm(await run('adminInfo',AP));}
async function exp(){$('ex').textContent='กำลังสร้าง…';const r=await run('adminExport',AP);$('ex').innerHTML='<p><a href="'+r.url+'" target="_blank">เปิด Google Sheets</a> · <a href="'+r.xlsx+'" target="_blank">ดาวน์โหลด Excel</a></p>';}
async function ph(id,b){b.textContent='กำลังโหลด…';const l=await run('adminPhotos',AP,id);b.textContent='รีเฟรชรูป';
 $('p'+id).innerHTML=l.map(p=>'<div><img src="'+p.img+'"><div class="t">'+esc(p.name)+'<br><label><input type="checkbox" '+(p.ok?'checked':'')+' onchange="aOk(\''+p.id+'\',this)"> รับเข้า</label><br><a href="#" style="color:var(--r)" onclick="adel(\''+p.id+'\',this);return false">ลบการสมัคร</a></div></div>').join('');}
async function adel(i,a){if(!confirm('ลบการสมัครของเลข '+i+'?'))return;await run('adminCancel',AP,i);a.closest('div').parentNode.remove();}

loginView();
</script></body></html>
